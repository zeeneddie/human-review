<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>human-review</title>
  <link rel="stylesheet" href="/chrome.css">
</head>
<body data-session="__SESSION_ID__" data-token="__TOKEN__">
  <div class="app">
    <nav class="tools" id="tools" hidden aria-label="Bewerken">
      <section class="tool-group modes">
        <div class="rail-head tight"><span class="section">Weergave</span></div>
        <div class="edit-list">
          <button type="button" class="edit-row tool mode" data-mode="review" title="Markeringen, opmerkingen en kaarten"><span class="ico">◉</span><span class="label">Review</span></button>
          <button type="button" class="edit-row tool mode" data-mode="grafisch" title="Kopjes, tabellen, lijsten en tekst"><span class="ico">✎</span><span class="label">Bewerken</span></button>
          <button type="button" class="edit-row tool mode" data-mode="bron" title="Het Markdown-bestand zelf: voetnoten, links, YAML, HTML"><span class="ico">&lt;/&gt;</span><span class="label">Bron</span></button>
        </div>
      </section>
      <section class="tool-group edit-only">
        <div class="rail-head tight"><span class="section">Blok</span></div>
        <div class="edit-list">
          <button type="button" class="edit-row tool" data-cmd="heading" data-payload='{"level":1}'><span class="ico">H1</span><span class="label">Kop 1</span></button>
          <button type="button" class="edit-row tool" data-cmd="heading" data-payload='{"level":2}'><span class="ico">H2</span><span class="label">Kop 2</span></button>
          <button type="button" class="edit-row tool" data-cmd="heading" data-payload='{"level":3}'><span class="ico">H3</span><span class="label">Kop 3</span></button>
          <button type="button" class="edit-row tool" data-cmd="heading" data-payload='{"level":4}'><span class="ico">H4</span><span class="label">Kop 4</span></button>
          <button type="button" class="edit-row tool" data-cmd="paragraph"><span class="ico">¶</span><span class="label">Alinea</span></button>
        </div>
      </section>
      <section class="tool-group edit-only">
        <div class="rail-head tight"><span class="section">Tekst</span></div>
        <div class="edit-list">
          <button type="button" class="edit-row tool" data-cmd="bold"><span class="ico"><b>B</b></span><span class="label">Vet</span></button>
          <button type="button" class="edit-row tool" data-cmd="italic"><span class="ico"><i>I</i></span><span class="label">Cursief</span></button>
          <button type="button" class="edit-row tool" data-cmd="strike"><span class="ico"><s>S</s></span><span class="label">Doorhalen</span></button>
          <button type="button" class="edit-row tool" data-cmd="code"><span class="ico">`</span><span class="label">Code in tekst</span></button>
          <button type="button" class="edit-row tool" data-ask="link"><span class="ico">↗</span><span class="label">Link</span></button>
        </div>
      </section>
      <section class="tool-group edit-only">
        <div class="rail-head tight"><span class="section">Structuur</span></div>
        <div class="edit-list">
          <button type="button" class="edit-row tool" data-cmd="bulletList"><span class="ico">•</span><span class="label">Opsomming</span></button>
          <button type="button" class="edit-row tool" data-cmd="orderedList"><span class="ico">1.</span><span class="label">Genummerd</span></button>
          <button type="button" class="edit-row tool" data-cmd="taskList"><span class="ico">☐</span><span class="label">Takenlijst</span></button>
          <button type="button" class="edit-row tool" data-cmd="indent"><span class="ico">⇥</span><span class="label">Inspringen</span></button>
          <button type="button" class="edit-row tool" data-cmd="outdent"><span class="ico">⇤</span><span class="label">Uitspringen</span></button>
          <button type="button" class="edit-row tool" data-cmd="blockQuote"><span class="ico">❝</span><span class="label">Citaat</span></button>
          <button type="button" class="edit-row tool" data-cmd="codeBlock"><span class="ico">{ }</span><span class="label">Codeblok</span></button>
          <button type="button" class="edit-row tool" data-cmd="hr"><span class="ico">―</span><span class="label">Scheidingslijn</span></button>
          <button type="button" class="edit-row tool" data-ask="image"><span class="ico">▣</span><span class="label">Afbeelding</span></button>
        </div>
      </section>
      <section class="tool-group edit-only">
        <div class="rail-head tight"><span class="section">Tabel</span></div>
        <div class="edit-list">
          <button type="button" class="edit-row tool" data-cmd="addTable" data-payload='{"rowCount":3,"columnCount":3}'><span class="ico">▦</span><span class="label">Tabel invoegen</span></button>
          <button type="button" class="edit-row tool" data-cmd="addRowToDown"><span class="ico">+</span><span class="label">Rij eronder</span></button>
          <button type="button" class="edit-row tool" data-cmd="addColumnToRight"><span class="ico">+</span><span class="label">Kolom rechts</span></button>
          <button type="button" class="edit-row tool" data-cmd="removeRow"><span class="ico">−</span><span class="label">Rij weg</span></button>
          <button type="button" class="edit-row tool" data-cmd="removeColumn"><span class="ico">−</span><span class="label">Kolom weg</span></button>
          <button type="button" class="edit-row tool" data-cmd="removeTable"><span class="ico">✕</span><span class="label">Tabel weg</span></button>
        </div>
      </section>
      <form class="tool-ask" id="toolAsk" hidden>
        <input type="text" id="toolAskUrl" placeholder="https://…" aria-label="Adres">
        <input type="text" id="toolAskText" placeholder="Tekst" aria-label="Tekst">
        <button type="submit" class="btn-primary">Invoegen</button>
      </form>
      <div class="tool-status" id="toolStatus"></div>
    </nav>
    <main class="stage">
      <iframe
        id="frame"
        title="Artifact under review"
        sandbox="allow-scripts allow-forms allow-modals"></iframe>
    </main>

    <button type="button" id="handle" class="handle" title="Hide comments panel" aria-label="Hide comments panel">›</button>

    <aside class="rail" id="rail">
      <div class="rail-scroll">
        <div class="rail-head">
          <span class="section">Feedback</span>
          <span class="dim" id="count">0</span>
          <button type="button" id="theme" class="icon-btn" title="Switch chrome to dark" aria-label="Switch chrome to dark">☾</button>
        </div>

        <section id="reportBox" class="report" hidden>
          <div class="rail-head tight">
            <span class="section">Rapport</span>
            <span class="dim" id="reportCount">0</span>
          </div>
          <div class="edit-list" id="reportList"></div>
        </section>

        <div id="leftover" class="leftover" hidden>
          <p id="leftoverText"></p>
          <div class="leftover-actions">
            <button type="button" id="leftoverKeep" class="btn-ghost">Keep</button>
            <button type="button" id="leftoverDiscard" class="btn-ghost danger-hover">Discard</button>
          </div>
        </div>

        <div id="compose" hidden>
          <div class="compose">
            <div class="compose-head">
              <span class="chip" id="composeKind">Selection</span>
              <span class="dim">Click to write · Esc to dismiss</span>
            </div>
            <p class="quote" id="composeQuote"></p>
            <textarea id="composeText" rows="3" placeholder="What should change?"></textarea>
            <div class="compose-actions">
              <button type="button" id="composeAdd" class="btn-primary">Add comment <span class="key">⏎</span></button>
              <button type="button" id="composeCancel" class="btn-ghost">Cancel</button>
            </div>
          </div>
        </div>

        <div id="cards" class="cards"></div>

        <div id="empty" class="empty">Select text or click an element to comment on it</div>

        <section id="othersBox" hidden>
          <div class="rail-head tight">
            <span class="section">Other pages</span>
            <span class="dim" id="othersCount">0</span>
          </div>
          <div class="edit-list" id="othersList"></div>
        </section>

        <section id="editsBox" hidden>
          <div class="rail-head tight">
            <span class="section">Your edits</span>
            <span class="dim" id="editCount">0</span>
            <button type="button" id="revert" class="link-btn danger-hover">Revert all</button>
          </div>
          <div class="save-line" id="saveLine"><span class="dot"></span><span id="saveText"></span></div>
          <div class="edit-list" id="editList"></div>
        </section>
      </div>

      <div class="rail-foot">
        <textarea id="note" rows="2" placeholder="Overall note…"></textarea>
        <button type="button" id="send" class="send" disabled>Niets te versturen</button>
        <button type="button" id="sendAll" class="send send-all" hidden disabled>Verstuur hele rapport</button>
        <div class="agent-line" id="agentLine" hidden><span class="dot amber"></span><span id="agentText"></span></div>
        <div class="handoff" id="handoff" hidden>
          <p class="handoff-title">Verstuurd — maar er luistert nog geen agent.</p>
          <p class="handoff-body">Plak dit in je agent — Claude Code, Codex of Cursor:</p>
          <div class="handoff-cmd"><code id="handoffCmd"></code></div>
          <button type="button" id="handoffCopy" class="btn-ghost">Kopieer opdracht</button>
        </div>
        <button type="button" id="endReview" class="end-review" title="Stop deze review en laat de wachtende agent los">Review beëindigen</button>
      </div>
    </aside>
  </div>

  <script type="module" src="/chrome.js"></script>
</body>
</html>
